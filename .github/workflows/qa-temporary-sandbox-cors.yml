name: QA | Temporary Sandbox CORS preflight
on:
  push:
    branches: [qa/booking-stripe-sandbox]
permissions:
  contents: read
jobs:
  cors-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real read-only OPTIONS test for exact Cloudflare Sandbox origin
        env:
          QA_ALLOWED_ORIGIN: https://ale-coach-qa-sandbox.pages.dev
        run: node scripts/qa-cors-preflight.mjs
