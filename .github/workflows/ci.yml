name: CI | Ale Coach
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript and production frontend build
        run: npm run build
      - name: Unit and release-gate tests
        run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Stripe Edge Functions (no deployment)
        run: deno check --node-modules-dir=auto supabase/functions/cancel-booking/index.ts supabase/functions/stripe-webhook/index.ts
      # Il backend è sul Supabase Cloud Ale Coach. Non eseguire seed o reset dei dati in CI.
