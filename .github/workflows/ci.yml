name: CI | Ale Coach
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript and production frontend build
        run: npm run build
      - name: Unit and release-gate tests
        run: npm test
      - name: Cloudflare Pages prelaunch build and static asset checks
        run: npm run pages:build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions and trusted-origin tests (no deployment)
        run: |
          deno check --node-modules-dir=auto supabase/functions/create-checkout/index.ts supabase/functions/cancel-booking/index.ts supabase/functions/decide-booking/index.ts
          deno test --allow-env supabase/functions/_shared/trusted-origins_test.ts
      # Il backend è sul Supabase Cloud Ale Coach. Non eseguire seed o reset dei dati in CI.
