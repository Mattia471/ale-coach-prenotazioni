name: QA | Cloudflare Auth public & RLS (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-public:
    name: Supabase Auth, public catalog and anonymous data isolation (GET only)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safe script syntax
        run: node --check scripts/qa-pages-auth-public.mjs
      - name: Read-only smoke against deployed Cloudflare Pages and Supabase Auth
        run: node scripts/qa-pages-auth-public.mjs
