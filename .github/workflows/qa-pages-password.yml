name: QA | Password-protected Pages preview
on:
  push:
    branches: [qa/booking-stripe-sandbox]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-middleware:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check QA middleware and every-route deny-by-default behavior
        run: node --test scripts/qa-pages-password.test.mjs
      - name: Run normal app build and regression suite
        run: |
          npm run build
          npm test
      - name: Validate Cloudflare Pages output without QA bypass
        run: |
          npm run pages:build
          test -f dist/_routes.json
          node -e "const r=require('./dist/_routes.json');if(JSON.stringify(r.include)!==JSON.stringify(['/*'])||r.exclude.length)process.exit(1)"
