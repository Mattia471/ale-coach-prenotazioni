name: QA | Password-protected Pages preview
on:
  push:
    branches: [qa/booking-stripe-sandbox]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-middleware:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check QA middleware and every-route deny-by-default behavior
        run: node --test scripts/qa-pages-password.test.mjs
      - name: Run normal app build and regression suite
        run: |
          npm run build
          npm test
      - name: Validate Cloudflare Pages output without QA bypass
        run: |
          npm run pages:build
          test -f dist/_routes.json
          node -e "const r=require('./dist/_routes.json');if(JSON.stringify(r.include)!==JSON.stringify(['/*'])||r.exclude.length)process.exit(1)"
      - name: Verify deployed QA preview rejects anonymous visitors
        env:
          QA_PREVIEW_ORIGIN: https://qa-booking-stripe-sandbox.ale-coach-prenotazioni.pages.dev
        run: |
          node --input-type=module <<'JS'
          const origin = process.env.QA_PREVIEW_ORIGIN;
          const paths = ['/', '/privacy', '/sw.js', '/manifest.webmanifest', '/assets/not-a-real-file.js'];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (const path of paths) {
            let passed = false, last = '';
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                const res = await fetch(origin + path, {
                  redirect: 'manual',
                  headers: {'Cache-Control':'no-cache'},
                  signal: AbortSignal.timeout(10000),
                });
                const challenge = res.headers.get('www-authenticate') || '';
                if (res.status !== 401) throw Error('Expected 401, got ' + res.status);
                if (!/^Basic\s/i.test(challenge)) throw Error('Missing HTTP Basic challenge');
                if (!/no-store/i.test(res.headers.get('cache-control') || ''))
                  throw Error('Protected asset not marked no-store');
                console.log('PASS ' + path + ': 401 Basic/no-store');
                passed = true;
                break;
              } catch (err) {
                last = String(err?.message || err);
                if (attempt < 5) await sleep(5000);
              }
            }
            if (!passed) throw Error('QA PREVIEW NOT VERIFIED on '+path+': '+last);
          }
          console.log('PASS: QA preview denies anonymous access on every tested route');
          JS
