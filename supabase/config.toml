# Ale Coach: unico database Supabase Cloud di proprietà del cliente.
# Non avviare Docker o stack Supabase locale. Migrazioni versionate in supabase/migrations.
project_id = "mmtnzjdvvlouiwgrydlf"

[auth]
enabled = true
site_url = "https://ale-coach-prenotazioni.vercel.app"
additional_redirect_urls = ["https://ale-coach-prenotazioni.vercel.app/**", "https://alecoach.online/**", "https://www.alecoach.online/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[db.seed]
enabled = false

[functions.create-checkout]
verify_jwt = true

[functions.cancel-booking]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.push-notify]
verify_jwt = false

[functions.google-calendar-sync]
verify_jwt = false
